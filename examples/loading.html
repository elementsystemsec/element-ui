<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pantalla de carga · Element UI</title>
<link rel="icon" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../components/cubes/element-cubes.css">
<link rel="stylesheet" href="examples.css">
<style>
  body{background:#15152a;color:#fff}
  .loader{min-height:100vh;display:grid;place-items:center;align-content:center;gap:10px;padding:24px;text-align:center}
  .art{position:relative;width:min(560px,100%);height:260px}
  .art .exhibit,.art .exhibit-scene{position:absolute;inset:0}
  .loader h1{margin:8px 0 6px;font-size:28px;font-weight:500;letter-spacing:-.03em}
  .loader button{height:40px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:none;color:#fff;font:inherit;cursor:pointer}
  .loader button:hover{background:rgba(255,255,255,.1)}
</style>
<script defer src="../components/cubes/element-cubes.js"></script>
<script defer src="variants.js"></script>
</head>
<body data-group="carga" data-variant="cubos">
<main class="loader">
  <div class="art">
    <div class="exhibit" id="cubes" data-element-cubes data-eui-mode="loading" data-eui-rows="3" data-eui-columns="5"
         data-eui-size="62" data-eui-gap="8" data-eui-face="#15152a" data-eui-border="#f29a6b">
      <div class="exhibit-scene"><div class="co-cube-wall"></div></div>
    </div>
  </div>
  <h1 role="status">Preparando tu espacio…</h1>
  <button type="button" id="toggle">Pausar animación</button>
</main>
<a class="ex-back" href="index.html">← Ejemplos</a>
<script>
  document.getElementById('toggle').addEventListener('click', function () {
    const cubes = ElementUI.Cubes.get(document.getElementById('cubes'));
    const paused = this.dataset.paused === 'yes';
    paused ? cubes.resume() : cubes.pause();
    this.dataset.paused = paused ? 'no' : 'yes';
    this.textContent = paused ? 'Pausar animación' : 'Reanudar animación';
  });
</script>
</body>
</html>
