name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Estructura de componentes y enlaces
        run: npm run check
      - name: dist/ está actualizado
        run: |
          npm run build
          git diff --exit-code -- dist || (echo "::error::dist/ no está actualizado. Ejecuta 'npm run build' y haz commit." && exit 1)
